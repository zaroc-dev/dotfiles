[shell]
font_family = "Inter"
screen_time_enabled = true
setup_wizard_enabled = false

    [shell.screenshot]
    directory = "/home/zaroc/Screenshots"
    filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "spicetify", "zen-browser", "zed" ]

[wallpaper]
directory = "/home/zaroc/wallpapers"
enabled = true

    [wallpaper.default]
    path = "/home/zaroc/wallpapers/cat_leaves.png"

    [wallpaper.last]
    path = "/home/zaroc/wallpapers/cat_leaves.png"

    [wallpaper.monitors.DP-1]
    path = "/home/zaroc/wallpapers/raiden.shogun.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/zaroc/wallpapers/chisa.jpg"

    [wallpaper.monitors.DP-5]
    path = "/home/zaroc/wallpapers/cat_leaves.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/zaroc/wallpapers/cat_leaves.png"

    [[wallpaper.favorite]]
    path = "/home/zaroc/wallpapers/cat_leaves.png"
    theme_mode = "auto"

[widget.control-center]
custom_image = "/home/zaroc/dotfiles/icons/lilith_monochrome_clean.png"
