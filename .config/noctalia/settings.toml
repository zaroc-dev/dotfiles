[backdrop]
blur_intensity = 0.29999999329447746
enabled = true
tint_intensity = 0.14999999664723873

[bar.default]
background_opacity = 0.0
border = "surface_variant"
capsule = true
capsule_opacity = 0.89999997988343239
capsule_padding = 8.0
capsule_radius = 8
capsule_thickness = 0.64999998919665813
center = [ "clock", "workspaces", "active_window" ]
color = "secondary"
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "session" ]
font_family = "Inter"
font_weight = 600
margin_ends = 0
padding = 25
panel_overlap = 0
position = "bottom"
radius = 0
shadow = false
start = [ "control-center", "media", "audio_visualizer" ]
thickness = 36

[location]
address = "Meßstetten, Germany"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-7",
    "lockscreen-login-box@DP-6",
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@DP-5",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1"
